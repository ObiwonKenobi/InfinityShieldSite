name: Flock tracker snapshot

# Weekly snapshot of Flock cameras mapped in Cheyenne and Laramie County
# (OpenStreetMap via Overpass), then a rebuild of /flock/.
# Run it by hand once with a backfill month to build the history.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill monthly history from YYYY-MM (leave empty for a normal snapshot)"
        required: false
        default: ""
      refresh_basemap:
        description: "Re-fetch the map basemap (it is fetched automatically if missing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: flock-tracker
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: |
          if [ -n "$BACKFILL_FROM" ]; then
            python3 -u tools/collect_flock.py --backfill "$BACKFILL_FROM" --budget-minutes 40
          else
            python3 -u tools/collect_flock.py
          fi
      - name: Basemap (Wyoming county lines, highways, places)
        if: ${{ hashFiles('flock/data/wy-basemap.json') == '' || github.event.inputs.refresh_basemap == 'true' }}
        continue-on-error: true
        run: python3 -u tools/collect_basemap.py
      - name: Wyoming flag (once)
        if: ${{ hashFiles('flock/assets/wyoming-flag.svg') == '' }}
        continue-on-error: true
        run: |
          mkdir -p flock/assets
          curl -fsSL -A "infinityshield-flock-tracker/1.0" "https://commons.wikimedia.org/wiki/Special:FilePath/Flag_of_Wyoming.svg" -o /tmp/flag.svg
          head -c 3000 /tmp/flag.svg | grep -qi "<svg"
          test "$(wc -c < /tmp/flag.svg)" -lt 500000
          if grep -qiE "<script|onload=|onclick=|javascript:" /tmp/flag.svg; then echo "flag file contains script-like content; not using it"; exit 1; fi
          mv /tmp/flag.svg flock/assets/wyoming-flag.svg
      - name: Build page
        if: always()
        run: python3 tools/build_flock.py
      - name: Commit if changed
        if: always()
        run: |
          git add flock/data/history.json flock/index.html
          git add flock/data/wy-basemap.json flock/data/map.json flock/assets/wyoming-flag.svg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Flock tracker: snapshot $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
