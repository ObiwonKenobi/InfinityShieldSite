name: Refresh visitor count
on:
  schedule:
    - cron: "17 12 * * *"   # daily, about 6 am Mountain
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: traffic
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh the count and rebuild the brief page
        run: python3 tools/build_brief.py --traffic-only
      - name: Commit if the count changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "no change"; exit 0; fi
          # Only the traffic snapshot and the pages it appears on may change here.
          bad=$(git status --porcelain | awk '{print $2}' | grep -v -e '^brief/data/traffic.json$' -e '^index.html$' -e '^info/index.html$' || true)
          if [ -n "$bad" ]; then echo "unexpected files changed: $bad"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brief/data/traffic.json index.html info/index.html
          git commit -m "Brief: refresh visitor count"
          git pull --rebase origin main
          git push origin HEAD:main
